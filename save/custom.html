<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI智能对话</title>
    <script src="feather.min.js"></script>
    <script src="vue.js"></script>
    <script src="modeltree.js"></script>
    <script src="theme.js"></script>
    <script src="heartbeat.js"></script>
    <script src="ai-protocol.js"></script>
    <link rel="stylesheet" href="chat-common.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="ai-ui.css">
    <style>
        .front-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .front-layer img {
            height: 100%;
            width: auto;
            display: block;
            flex-shrink: 0;
        }
		.dialog-layer {
		    height: 90vh;
		}
		@media (max-width: 768px) {
			.dialog-layer {
                height: 90vh;
            }
		}
		.button-group {
			display: flex;
			gap: 12px;
			justify-content: flex-end;
			
		}

        /* 侧边栏样式见 sidebar.css（custom / painter / painter-local 共用） */
		.setting-export-btn:hover {
			background: #2a7fff;
		}
    </style>
</head>
<body>
    <div id="app" @click="showDialog=true;unlockWebAudio();" @contextmenu.prevent="showDialog=false">
    <ai-conn-tip></ai-conn-tip>
    <ai-dialog></ai-dialog>
     

        <!-- 侧边栏组件 -->
        <div class="chat-sidebar" :class="{ open: sidebarOpen }">
            <div class="sidebar-header">
                <h3><i data-feather="message-square"></i> 历史对话</h3>
                <button class="sidebar-close" @click.stop="sidebarOpen = false"><i data-feather="x"></i></button>
            </div>
            <div class="sidebar-action-btn" @click="editCurrentChat">
                <i data-feather="edit-2"></i> 编辑当前对话
            </div>
            <div class="chat-list" v-if="chatList.length">
                <div v-for="chat in chatList" :key="chat.chatid" class="chat-item" :class="{ active: currentChatId === chat.chatid }" @click="selectChat(chat)">
                    <div class="chat-info">
                        <div class="chat-name">{{ chat.name || '未命名对话' }}</div>
                        <div class="chat-time">{{ formatTime(chat.time) }}</div>
                    </div>
                    <div class="chat-item-actions">
                        <button class="chat-action" title="重命名" @click.stop="renameChat(chat)">✎</button>
                        <button class="chat-action danger" title="归档（归档后不再显示，可在存档管理中恢复）" @click.stop="archiveChat(chat)">⊘</button>
                    </div>
                </div>
            </div>
            <div v-else class="chat-empty">
                <i data-feather="inbox"></i> 暂无历史对话
            </div>
			<div class="sidebar-action-btn" @click="newChat">
                <i data-feather="file"></i> 新建对话
            </div>
        </div>

        <div class="layer bg-layer">
            <img :src="aiImages.back" alt="背景" class="bg-image" v-if="aiImages.back">
        </div>
        <div class="layer fg-layer">
            <div class="fg-container">
                <div class="front-layer">
                    <img :src="aiImages.front" alt="人物" v-if="aiImages.front">
                </div>
                <div class="side-layer">
                    <img :src="aiImages.side" alt="人物" v-if="aiImages.side">
                </div>
            </div>
        </div>
		<div class="layer dialog-layer" :style="{ bottom: inputBarHeight + 'px' }" v-if="!showHistory&&showDialog">
		    <div class="messages-container" ref="msgContainer" @scroll="onHistoryScroll">
		        <div v-if="isLoadingMore" class="history-tip loading">正在加载更早的记录</div>
		        <div v-else-if="historyTopReached && !hasMoreHistory" class="history-tip">没有更早的记录啦</div>
		        <div v-for="(msg, idx) in recentMessages"  :key="idx" >
					<div v-for="msg2 in aiRevealedLines(msg)">
						<template v-if="msg2.length>0"><template v-if="msg.title !== '系统'&&msg.title!=''">【{{ msg.title }}】「</template><span v-html="msg2"></span><template v-if="msg.title !== '系统'&&msg.title!=''">」</template></template>
					</div>
					<!-- 撤回/重说/朗读跟随最新一条消息，避免占用手边的工具栏；生成过程中不显示 -->
					<div class="msg-actions" v-if="idx === recentMessages.length - 1 && prepared && !aiGenerating">
						<button class="btn msg-action-btn" v-if="!lastMessageIsUser" @click="aiSendRegen" title="重新生成这条回复"><svg class="msg-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>重说</button>
						<button class="btn msg-action-btn" @click="aiSendRevert" title="撤回最后一轮对话"><svg class="msg-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>撤回</button>
						<button class="btn msg-action-btn" v-if="!lastMessageIsUser && aiVoiceUsable && messages.length>0 && messages[messages.length-1].audioId==undefined" @click="aiSendGenVoice" title="朗读这条回复"><svg class="msg-action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>朗读</button>
					</div>
				</div>
		    </div>
		    <div class="dialog-sidebar">
		        <div class="typing-area" v-if="aiGenerating">
		            <span class="typing-text">生成中</span>
		            <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
		        </div>
		        <div class="button-group">
					<button class="btn toolbar-btn" @click.stop="toggleSidebar"><i data-feather="menu"></i>对话</button>
		            <button class="btn toolbar-btn" @click="openSettings" v-show="prepared"><i data-feather="settings"></i>设置</button>
					   <!-- 侧边栏切换按钮 -->
				</div>
		    </div>
		</div>
		<!-- 设置界面浮层 -->
		<div class="layer setting-layer" v-if="showSettings" @click.self="closeSettings">
			<div class="setting-container">
				<div class="setting-header">
					<h3><i data-feather="settings"></i> 设置</h3>
					<button class="close-setting" @click="closeSettings"><i data-feather="x"></i></button>
				</div>
				<div class="setting-content">
					<!-- 白天/黑夜模式 -->
					<div class="setting-row">
						<span class="setting-row-label">白天模式</span>
						<button class="setting-switch" :class="{ 'is-on': isDayMode }" @click.stop="setDayMode(!isDayMode)" :aria-pressed="isDayMode ? 'true' : 'false'">
							<span class="setting-switch-knob"></span>
						</button>
					</div>
					<!-- 模型选择区域：按 "/" 分层的目录树，默认全部展开 -->
					<div class="model-selector">
						<label>选择模型</label>
						<model-tree v-model="aiModel" :nodes="aiModelTree" @change="aiSetModel"></model-tree>
					</div>
					<!-- 导出按钮（原功能保留） -->
					<button class="btn setting-export-btn" @click="exportHistory">
						<i data-feather="download"></i> 导出对话记录
					</button>
					<button class="btn setting-export-btn" @click="exportMemory">
						<i data-feather="download"></i> 导出记忆
					</button>
					<!-- 语音开关：开启后新回复会自动朗读 -->
					<div class="setting-row" v-show="aiVoiceUsable">
						<span class="setting-row-label">默认使用朗读</span>
						<button class="setting-switch" :class="{ 'is-on': aiVoiceEnabled }" @click.stop="setVoiceEnabled(!aiVoiceEnabled)" :aria-pressed="aiVoiceEnabled ? 'true' : 'false'">
							<span class="setting-switch-knob"></span>
						</button>
					</div>
				</div>
			</div>
		</div>
        <div class="bottom-input-bar" ref="bottomBar" v-if="prepared">
            <textarea 
                ref="messageInput"
                class="auto-textarea" 
                placeholder="输入消息..." 
                v-model="newMessage"
				
                @input="adjustTextareaHeight"
                @keydown.enter.exact.prevent="sendUserMessage" 
                rows="1"></textarea>
            <button class="send-btn" @click="sendUserMessage">发送</button>
        </div>
    </div>

    <script>
		var pageQueries={};
		var searchStr = location.toString();
		searchStr = searchStr.substr(searchStr.indexOf("?")+1);
		searchStr=searchStr.replace("#","");
		var searchs = searchStr.split("&");
		var isFirstSelect=false;
		for(var i=0;i<searchs.length;i++){
			var rq = searchs[i].split("=");
			pageQueries[rq[0]]=rq[1];
		}
		/** 当前用户ID：兼容 uid / userId 两种页面参数写法 */
		function aiUid(){
			return pageQueries.uid || pageQueries.userId || '';
		}
		feather.replace();
		let msgs=new Vue({
		         el: '#app',
		         // 连接/重连/心跳/帧路由/历史分页由公共协议层提供
		         mixins: [AIProtocolMixin],
		         data: {
		             messages: [
		             ],
		             newMessage: '',
		             showHistory: false,
					 showDialog: true,
		             inputBarHeight: 70,
					 prepared: false,
					 appId:'',
					 chatId:'',
					 url:'/aichat',
					 audioCtx:null,
					 isUnlocked:false,
                     // 侧边栏新增属性
                     chatList: [],
                     sidebarOpen: false,
                     currentChatId: null,
                     loadingChatList: false,
					 showSettings: false,       // 控制设置界面显隐
					 isDayMode: !!(window.AIWuxiaTheme && AIWuxiaTheme.isDay()),  // 白天/黑夜模式
		         },
				 computed: {
				     recentMessages() {
				         return this.messages;
				     }
				 },
		         methods: {
                    // 格式化时间戳 (ms字符串)
                    formatTime(timestampMs) {
                        if (!timestampMs) return '';
                        const date = new Date(parseInt(timestampMs));
                        return `${date.getMonth()+1}/${date.getDate()} ${date.getHours().toString().padStart(2,'0')}:${date.getMinutes().toString().padStart(2,'0')}`;
                    },
                    // 获取聊天列表（只拉取本页面所属应用 custom 的对话，避免串到其它智能体）
                    async fetchChatList() {
                        const uid = aiUid();
                        this.loadingChatList = true;
                        try {
                            const res = await fetch(`querychat?appid=${this.appId || 'custom'}&uid=${encodeURIComponent(uid)}`);
                            const data = await res.json();
                            if (Array.isArray(data)) {
                                this.chatList = data;
                            } else {
                                this.chatList = [];
                            }
                        } catch(e) {
                            console.error('获取对话列表失败', e);
                            this.chatList = [];
                        } finally {
                            this.loadingChatList = false;
                        }
                    },
                    // 重命名对话：名称保存在 chats.brief，重命名后不再被AI自动改写
                    renameChat(chat) {
                        if (!chat || !chat.chatid) return;
                        const done = (name) => {
                            if (name == null) return;
                            const body = new URLSearchParams();
                            body.append('chatid', chat.chatid);
                            body.append('name', name);
                            fetch('renameChat?uid='+encodeURIComponent(aiUid()), { method: 'POST', body: body })
                                .then(r => r.status === 200 ? r.text() : r.text().then(t => Promise.reject(t)))
                                .then(saved => {
                                    chat.name = saved;
                                    if (this.currentChatId === chat.chatid) document.title = 'AI-' + saved;
                                    this.aiToast('已重命名');
                                })
                                .catch(err => this.aiToast('重命名失败：' + err, { kind: 'warn' }));
                        };
                        const ask = this.aiPrompt({
                            title: '重命名对话',
                            message: '请输入新的对话名称',
                            value: chat.name || '',
                            placeholder: '对话名称',
                        });
                        if (ask && typeof ask.then === 'function') ask.then(done);
                        else done(window.prompt('请输入新的对话名称', chat.name || ''));
                    },
                    // 归档对话：归档后不再出现在本页列表，可在存档管理页的"已归档"中恢复
                    archiveChat(chat) {
                        if (!chat || !chat.chatid) return;
                        const tip = '归档后该对话不再出现在聊天列表中，可在存档管理中恢复。确定归档吗？';
                        const doArchive = () => {
                            const body = new URLSearchParams();
                            body.append('chatid', chat.chatid);
                            fetch('archiveChat?uid='+encodeURIComponent(aiUid()), { method: 'POST', body: body })
                                .then(r => r.status === 200 ? r.text() : r.text().then(t => Promise.reject(t)))
                                .then(() => {
                                    this.aiToast('已归档');
                                    const wasCurrent = this.currentChatId === chat.chatid;
                                    this.fetchChatList().then(() => {
                                        // 归档的是当前对话时，切到列表中剩下的第一个对话
                                        if (wasCurrent) {
                                            if (this.chatList.length > 0) {
                                                const next = this.chatList[0];
                                                this.switchToChat(next.appid, next.chatid);
                                            } else {
                                                window.open('agentedit', '_blank');
                                            }
                                        }
                                    });
                                })
                                .catch(err => this.aiToast('归档失败：' + err, { kind: 'warn' }));
                        };
                        const ask = this.aiConfirm({ title: '归档对话', message: tip, kind: 'danger' });
                        if (ask && typeof ask.then === 'function') ask.then(ok => { if (ok) doArchive(); });
                        else if (window.confirm(tip)) doArchive();
                    },
                    // 侧边栏切换
                    toggleSidebar() {
                        this.sidebarOpen = !this.sidebarOpen;
                    },
                    // 选择对话
                    selectChat(chat) {
                        if (!chat.chatid || !chat.appid) return;
                        if (this.currentChatId === chat.chatid && this.prepared) {
                            this.sidebarOpen = false;
                            return;
                        }
                        this.sidebarOpen = false;
                        this.switchToChat(chat.appid, chat.chatid);
                    },
                    // 切换对话核心逻辑
                    switchToChat(appid, chatid) {
                        this.chatId = chatid;
                        this.appId = appid;
                        this.currentChatId = chatid;
                        this.messages.splice(0, this.messages.length);
                        // 取消未播完的动画与排队中的帧，避免写进新会话
                        this.aiCancelPipeline();
                        // 切换对话时重置历史记录分页状态（换连接由 aiConnect 内部安全处理）
                        this.aiResetHistory();
                        // 更新URL参数
                        const url = new URL(location.href);
                        url.searchParams.set('chatid', chatid);
                        window.history.replaceState({}, '', url);
                        this.open(() => {
                            // 可选，连接成功后请求历史（ws会自动同步）
                        });
                    },
                    // 编辑当前对话
                    editCurrentChat() {
                        const cid = this.currentChatId;
                        if (!cid) {
                            this.aiToast('请先选择一个对话', { kind: 'warn' });
                            return;
                        }
                        window.open(`agentedit?chatid=${cid}`, '_blank');
                    },
					
					newChat(){
						
                        window.open(`agentedit`, '_blank');
					},
                    // 原有角色初始化 (无地址栏匹配时使用)
                    roleBasedInit() {
                    },
                    // 整体启动逻辑：先加载列表，再处理url chatid
                    async startup() {
                        await this.fetchChatList();
                        const urlChatId = pageQueries.chatid;
                        let matched = false;
                        if (urlChatId && this.chatList.length) {
                            const target = this.chatList.find(c => c.chatid === urlChatId);
                            if (target) {
                                matched = true;
                                this.switchToChat(target.appid, target.chatid);
                            }
                        }
                        if (!matched) {
                            // 没有匹配到，执行原有角色初始化
                            this.roleBasedInit();
                        }
                        // 定期刷新列表（可选，每次切换后刷新列表，保持最新）
                    },
					initChat(){
                        // 废弃直接调用，改用startup
                        this.startup();
					},
					setVoiceEnabled(nw){
						this.aiSetVoiceEnabled(nw);
						this.unlockWebAudio();
					},
					/* ---- 场景图片槽位：切换逻辑在公共层，加载完成后才换图 ---- */
					aiScenePrefix(){
						return 'resource/';
					},
					exportHistory(){
						const form = document.createElement('form');
						form.method = 'POST';
						form.action = "exportChat?app="+this.appId+"&chatid="+this.chatId+"&uid="+encodeURIComponent(aiUid());
						form.target = 'downloadFrame';
						let iframe = document.getElementById('downloadFrame');
						if (!iframe) {
						    iframe = document.createElement('iframe');
						    iframe.id = 'downloadFrame';
						    iframe.name = 'downloadFrame';
						    iframe.style.display = 'none';
						    document.body.appendChild(iframe);
						}
						document.body.appendChild(form);
						form.submit();
						document.body.removeChild(form);
					},
					exportMemory(){
						const form = document.createElement('form');
						form.method = 'POST';
						form.action = "exportMemory?app="+this.appId+"&chatid="+this.chatId+"&uid="+encodeURIComponent(aiUid());
						form.target = 'downloadFrame';
						let iframe = document.getElementById('downloadFrame');
						if (!iframe) {
						    iframe = document.createElement('iframe');
						    iframe.id = 'downloadFrame';
						    iframe.name = 'downloadFrame';
						    iframe.style.display = 'none';
						    document.body.appendChild(iframe);
						}
						document.body.appendChild(form);
						form.submit();
						document.body.removeChild(form);
					},
					open(done){
						this.aiResetImages();
						this.aiGenerating=false;
						this._openDone=done;
						this.aiConnect();
					},
					/* ============ 公共协议层（ai-protocol.js）：连接与帧钩子 ============ */
					aiSocketUrl(){
						return (location.protocol=="http:"?"ws:":"wss:")+"//khjxiaogu.com"+this.url+"/chatsocket?app="+this.appId+"&chatid="+this.chatId+"&userId="+encodeURIComponent(aiUid());
					},
					aiOnSocketOpen(){
						this.prepared=true;
						// 离开页面时主动断开（公共层会摘掉监听，不会触发重连）
						window.onbeforeunload=()=>this.aiDisconnect();
						if(this._openDone) this._openDone();
						// 刷新侧边栏列表 (确保最新)
						this.fetchChatList().then(()=>this.refreshChatTitle());
					},
					// 用当前对话的信息刷新页面标题（只认本应用、本对话）
					refreshChatTitle(){
						const cur = (this.chatList || []).find(c => c.chatid === this.chatId);
						if (cur && cur.name) document.title = "AI-" + cur.name;
					},
					aiOnConnState(state){
						// 断开/重连提示由公共层统一显示（<ai-conn-tip>），这里只做页面自己的状态处理
						if(state!="connected") this.prepared=false;
					},
					/* ---- 公共协议层：串行动画管道 ---- */
					// 需要按动画节奏落地的帧：进同一条管道（顺序由 Promise 链保证，可在处理器里 await）
					aiOnContent(frame){
						this.aiEnqueue(frame);
					},
					aiOnMessage(frame){
						this.aiEnqueue(frame);
					},
					aiOnRemove(frame){
						this.aiEnqueue(frame);
					},
					aiOnAudio(frame){
						// 语音到达即播放，同时入队更新消息上的 audioId
						if(frame.audioId) this.playSoundWithWebAudio(frame.audioId);
						this.aiEnqueue(frame);
					},
					// 帧如何落地：文本走揭示动画，立绘等图片先 await 加载完成
					async aiHandleQueuedFrame(frame){
						if(frame.type=='scene'){
							// 立绘已经立即切换，这里只等加载完成再继续后续帧
							if(frame.promise) await frame.promise;
						}else if(frame.type=='content'){
							this.appendMsg(frame.id,this.aiContentToText(frame.content));
						}else if(frame.type=='remove'){
							this.removeMessage(frame.id);
						}else if(frame.type=='message'){
							var full=this.aiContentToText(frame.content);
							var exist=this.messages.find(m=>m.id===frame.id);
							if(exist){
								// 同一标识的消息已存在（例如流式过程中补齐）：更新全文并继续揭示
								exist.text=full;
								this.aiRevealStart(exist);
							}else{
								var msg=this.addMessage(frame.id,frame.title,full,frame.audioId,frame.role);
								msg.revealed=0;
								this.aiRevealStart(msg);
							}
						}else if(frame.type=='audio'){
							this.setAudioId(frame.id,frame.audioId);
						}
					},
					/* ---- 公共协议层：帧钩子 ---- */
					aiOnSendbox(text){
						this.newMessage=text;
					},
					aiOnInput(input,promptText){
						// 统一对话框替代 prompt：取消返回 null（与 prompt 语义一致）
						this.aiPrompt({
							title:'需要你的输入',
							message:promptText||'',
							placeholder:'请输入内容',
						}).then(function(text){
							if(text!=null&&text!="")
								this.aiSendPromptReply(input,text);
						}.bind(this));
					},
					// 历史分页落地：视口锚定与分页状态由公共层负责
					aiOnBatch(items,meta){
						if(meta.prepend){
							// 向上翻页：按标识符去重后插入到最前面
							var known={};
							for(var k=0;k<this.messages.length;k++){
								if(this.messages[k].id!=null) known[this.messages[k].id]=true;
							}
							var incoming=[];
							for(var i=0;i<items.length;i++){
								var old=items[i];
								if(old.id!=null){
									if(known[old.id]) continue;
									known[old.id]=true;
								}
								incoming.push({text:old.text,title:old.title,id:old.id,audioId:old.audioId,role:old.role,revealed:null});
							}
							for(var j=incoming.length-1;j>=0;j--){
								this.messages.unshift(incoming[j]);
							}
						}else{
							// 连接/重连下发的是最新一页：替换最新范围，同时保留本地已翻出来的更早记录
							var oldestIncoming=null;
							for(var i=0;i<items.length;i++){
								var id=items[i].id;
								if(id!=null&&(oldestIncoming===null||id<oldestIncoming)) oldestIncoming=id;
							}
							var kept=[];
							if(oldestIncoming!=null){
								for(var k=0;k<this.messages.length;k++){
									var local=this.messages[k];
									if(local.id!=null&&local.id<oldestIncoming) kept.push(local);
								}
							}
							// 整表替换前先停掉仍在揭示的旧消息
							this.aiRevealClear();
							this.messages.splice(0,this.messages.length)
							for(var k=0;k<kept.length;k++){
								this.messages.push(kept[k]);
							}
							for(var i=0;i<items.length;i++){
								this.addMessage(items[i].id,items[i].title,items[i].text,items[i].audioId,items[i].role);
							}
						}
					},
					// 分页游标：本地最旧的一条记录
					aiOldestMessageId(){
						var oldest=null;
						for(var k=0;k<this.messages.length;k++){
							var id=this.messages[k].id;
							if(id!=null&&(oldest===null||id<oldest)) oldest=id;
						}
						return oldest===null?0:oldest;
					},
					openApp(app,id,done){
						this.chatId=id;
						this.appId=app;
                        this.currentChatId = id;
						this.messages.splice(0,this.messages.length);
						// 取消未播完的动画与排队中的帧，避免写进新会话
						this.aiCancelPipeline();
						// 切换对话时重置历史记录分页状态（换连接由 aiConnect 内部安全处理）
						this.aiResetHistory();
                        const url = new URL(location.href);
                        url.searchParams.set('chatid', id);
                        window.history.replaceState({}, '', url);
						this.open(done);
                        this.fetchChatList(); // 刷新列表，高亮当前
					},
		             adjustTextareaHeight() {
		                 this.$nextTick(() => {
		                     const textarea = this.$refs.messageInput;
		                     if (!textarea) return;
		                     textarea.style.height = 'auto';
		                     textarea.style.height = textarea.scrollHeight + 'px';
		                     const bottomBar = this.$refs.bottomBar;
		                     if (bottomBar) {
		                         this.inputBarHeight = bottomBar.offsetHeight;
		                     }
		                 });
		             },
		             addMessage(id,title,text,aid,role) {
		                 const msg={ text: text, title: title, id: id , audioId:aid, role: role || (title === this.aiUserTitle ? 'user' : 'assistant'), revealed: null };
		                 this.messages.push(msg);
		                 this.$nextTick(() => {
		                     const textarea = this.$refs.messageInput;
		                     if (textarea) {
		                         textarea.style.height = 'auto';
		                         textarea.style.height = textarea.scrollHeight + 'px';
		                     }
		                     const bottomBar = this.$refs.bottomBar;
		                     if (bottomBar) {
		                         this.inputBarHeight = bottomBar.offsetHeight;
		                     }
		                     const container = this.$refs.msgContainer;
		                     if (container && !this.suppressAutoScroll) container.scrollTop = container.scrollHeight;
		                 });
		             
		             	return msg;
		             },
					 setAudioId(id,audioId){
						for(var i=0;i<this.messages.length;i++){
							if(this.messages[i].id==id){
								this.messages[i].audioId=audioId;
								break;
							}
						}
					 },
					 unlockWebAudio() {
						if (this.audioCtx && this.audioCtx.state === 'running') return;
						this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
						const buffer = this.audioCtx.createBuffer(1, 1, 22050);
						const source = this.audioCtx.createBufferSource();
						source.buffer = buffer;
						source.connect(this.audioCtx.destination);
						source.start();
						if (this.audioCtx.state === 'suspended') {
							this.audioCtx.resume().then(() => {
								this.isUnlocked = true;
							});
						} else {
							this.isUnlocked = true;
						}
					},
					playSoundWithWebAudio(url) {
						if (!this.isUnlocked || !this.audioCtx) return;
						fetch("voice/"+url+".mp3")
							.then(response => response.arrayBuffer())
							.then(arrayBuffer => this.audioCtx.decodeAudioData(arrayBuffer))
							.then(audioBuffer => {
								const source = this.audioCtx.createBufferSource();
								source.buffer = audioBuffer;
								source.connect(this.audioCtx.destination);
								source.start();
							});
					},
					 appendMsg(id,msg){
						for(var i=0;i<this.messages.length;i++){
							if(this.messages[i].id==id){
								this.messages[i].text+=msg;
								// 文本增长后继续揭示（揭示循环空闲时会自动重启）
								if(this.messages[i].revealed!=null) this.aiRevealStart(this.messages[i]);
								break;
							}
						}
						this.$nextTick(() => {
		                     const textarea = this.$refs.messageInput;
		                     if (textarea) {
		                         textarea.style.height = 'auto';
		                         textarea.style.height = textarea.scrollHeight + 'px';
		                     }
		                     const bottomBar = this.$refs.bottomBar;
		                     if (bottomBar) {
		                         this.inputBarHeight = bottomBar.offsetHeight;
		                     }
		                     const container = this.$refs.msgContainer;
		                     if (container && !this.suppressAutoScroll) container.scrollTop = container.scrollHeight;
		                 });
					},
					 removeMessage(id){
						for(var i=0;i<this.messages.length;i++){
							if(this.messages[i].id==id){
								this.aiRevealDrop(this.messages[i]);
								this.messages.splice(i,1);
								break;
							}
						}
						if(this.messages.length<4)
							this.aiRequestHistory();
					 },
					 sendUserMessage(content){
						if(!this.aiIsAnyImageLoading()&&!this.aiGenerating){
							if(this.newMessage!=''&&this.aiIsOpen()){
								this.aiSendMessage(this.newMessage);
								this.aiGenerating=true;
								//this.newMessage='';
							}
						}
	 				 },
		             openHistory() {
		                 this.showHistory = true;
						  this.$nextTick(() => {
						    if(this.$refs["histlay"]) this.$refs["histlay"].scrollTop= this.$refs["histlay"].scrollHeight;
						 });
		             },
		             closeHistory() {
		                 this.showHistory = false;
		             },
					 openSettings() {
						this.showSettings = true;
						this.$nextTick(() => feather.replace());
					},
					// 关闭设置界面
					closeSettings() {
						this.showSettings = false;
					},
					// 白天/黑夜模式切换（偏好保存在本地，各页面共用）
					setDayMode(day) {
						this.isDayMode = day;
						if (window.AIWuxiaTheme) AIWuxiaTheme.setDay(day);
					},
		         },
		         watch: {
		             messages: {
		                 handler() {
		                     if (this.suppressAutoScroll) return;
		                     this.$nextTick(() => {
		                         const container = this.$refs.msgContainer;
		                         if (container) container.scrollTop = container.scrollHeight;
		                     });
		                 },
		                 deep: true
		             }
		         },
		         mounted() {
		             this.$nextTick(() => {
		                 const container = this.$refs.msgContainer;
		                 if (container) container.scrollTop = container.scrollHeight;
		                 this.adjustTextareaHeight();
		             });
                     // 启动整体初始化
                     this.startup();
		         }
		     });
        // 移除旧的 initChat 调用，改为 startup 在 mounted 中调用
    </script>
</body>
